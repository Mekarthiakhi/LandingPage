<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dark Luxury Background Gradient -->
    <linearGradient id="pinnacleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c18"/>
      <stop offset="50%" stop-color="#121210"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>

    <!-- Radiant Gold Highlight (Left facets & pinnacle peak) -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="35%" stop-color="#F3D18B"/>
      <stop offset="70%" stop-color="#D4AA58"/>
      <stop offset="100%" stop-color="#A57D37"/>
    </linearGradient>

    <!-- Rich Bronze Gold Shadow (Right facets) -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C37B"/>
      <stop offset="40%" stop-color="#B88E44"/>
      <stop offset="80%" stop-color="#845E24"/>
      <stop offset="100%" stop-color="#553A12"/>
    </linearGradient>

    <!-- Brilliant Star Gradient -->
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF0D0"/>
      <stop offset="80%" stop-color="#E5BE6E"/>
      <stop offset="100%" stop-color="#C59B4B"/>
    </linearGradient>

    <!-- Fine Gold Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DBA3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8C6930" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AA58" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Star Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge Container: Luxury Squircle with Gold Rim -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#pinnacleBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" stroke="url(#goldBorder)" stroke-width="1.4"/>
  
  <!-- Subtle Inner Inset Line -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="11" stroke="#D4AA58" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- ICONIC ARCHITECTURAL CREST (Maximized scale for tab icon clarity) -->
  <g id="pinnacle-crest">
    <!-- TOWER 1 (Left 55-Floor Tower) -->
    <!-- Outer light facet -->
    <path d="M12 25 L21 18 L21 52 L12 52 Z" fill="url(#goldLight)"/>
    <!-- Inward bevel/shadow -->
    <path d="M17 21.1 L21 18 L21 52 L17 52 Z" fill="url(#goldDark)" opacity="0.3"/>

    <!-- TOWER 2 (Right 55-Floor Tower) -->
    <!-- Outer shadow facet -->
    <path d="M43 18 L52 25 L52 52 L43 52 Z" fill="url(#goldDark)"/>
    <!-- Inward highlight facet -->
    <path d="M43 18 L47 21.1 L47 52 L43 52 Z" fill="url(#goldLight)" opacity="0.4"/>

    <!-- Tower Window Louvers / Floor Strata (Sharp modern horizontal slits) -->
    <line x1="14.5" y1="28" x2="18.5" y2="28" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14.5" y1="34" x2="18.5" y2="34" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14.5" y1="40" x2="18.5" y2="40" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14.5" y1="46" x2="18.5" y2="46" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>

    <line x1="45.5" y1="28" x2="49.5" y2="28" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="45.5" y1="34" x2="49.5" y2="34" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="45.5" y1="40" x2="49.5" y2="40" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="45.5" y1="46" x2="49.5" y2="46" stroke="#0a0a08" stroke-width="1.2" stroke-linecap="round"/>

    <!-- CENTRAL PINNACLE APEX (Ascending Tower Spire) -->
    <!-- Left Facet (Light/Gold) -->
    <path d="M32 12 L23 44 L32 41 Z" fill="url(#goldLight)"/>
    <!-- Right Facet (Dark/Bronze) -->
    <path d="M32 12 L41 44 L32 41 Z" fill="url(#goldDark)"/>
    <!-- Center Crease Highlight -->
    <line x1="32" y1="12" x2="32" y2="41" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.6"/>

    <!-- Podium Foundation Base Plinth -->
    <path d="M10 54 L54 54" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 57 L48 57" stroke="url(#goldDark)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- ZENITH PINNACLE STAR: Radiant 4-Point Diamond Spark -->
    <path d="M32 4 C32 8 30 10 26 10 C30 10 32 12 32 16 C32 12 34 10 38 10 C34 10 32 8 32 4 Z" fill="url(#goldStar)" filter="url(#starGlow)"/>
    <circle cx="32" cy="10" r="1.1" fill="#FFFFFF"/>
  </g>
</svg>